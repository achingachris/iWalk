name: iWalk

options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  iWalkCore:
    path: iWalkCore

targets:
  iWalk:
    type: application
    platform: iOS
    sources:
      - path: iWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).iwalk
        PRODUCT_NAME: iWalk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iWalk/Info.plist
      properties:
        CFBundleDisplayName: iWalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: iWalk uses your location to follow your route and record your walk, hike or run, even with no internet.
        NSHealthShareUsageDescription: iWalk reads your workouts and heart rate to show your history.
        NSHealthUpdateUsageDescription: iWalk saves your walks, hikes and runs, with their route, to Health.
        UIBackgroundModes: [location, workout-processing]
        NSSupportsLiveActivities: true
        IWalkBaseURL: $(IWALK_BASE_URL)
        IWalkAPIKey: $(IWALK_API_KEY)
    entitlements:
      path: iWalk/iWalk.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: iWalkCore
        product: iWalkCore
      - package: iWalkCore
        product: iWalkStore
      - target: iWalkWidgets
      - target: iWalkWatch
    scheme: {}

  iWalkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iWalkWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).iwalk.widgets
        PRODUCT_NAME: iWalkWidgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iWalkWidgets/Info.plist
      properties:
        CFBundleDisplayName: iWalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: iWalkCore
        product: iWalkCore

  iWalkWatch:
    type: application
    platform: watchOS
    sources:
      - path: iWalkWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).iwalk.watchkitapp
        PRODUCT_NAME: iWalkWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iWalkWatch/Info.plist
      properties:
        CFBundleDisplayName: iWalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX).iwalk
        UIBackgroundModes: [workout-processing]
        NSLocationWhenInUseUsageDescription: iWalk uses your location to follow your route and record the workout route.
        NSHealthShareUsageDescription: iWalk reads heart rate, distance and energy during your workout.
        NSHealthUpdateUsageDescription: iWalk saves your walks, hikes and runs, with their route, to Health.
    entitlements:
      path: iWalkWatch/iWalkWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: iWalkCore
        product: iWalkCore
      - package: iWalkCore
        product: iWalkStore
    scheme: {}
